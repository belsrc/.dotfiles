# -- general -------------------------------------------------------------------

set -g prefix C-a            # GNU-Screen compatible prefix
unbind C-b
bind-key C-a send-prefix

set -s escape-time 10         # faster command sequences
set -sg repeat-time 600       # increase repeat timeout
set -s focus-events on

set -g history-limit 5000     # boost history

set -g mouse on               # enable mouse

set -s extended-keys on       # turn on extended keys

# refresh config
unbind r
bind r source-file ~/.tmux.conf

# -- display -------------------------------------------------------------------

# set -g default-terminal "screen-256color"

set -g base-index 1            # start windows numbering at 1
setw -g pane-base-index 1      # make pane numbering consistent with windows

setw -g automatic-rename on    # rename window to reflect current program
set -g renumber-windows on     # renumber windows when a window is closed

set -g set-titles on           # set terminal title

set -g display-panes-time 800  # slightly longer pane indicators display time
set -g display-time 1000       # slightly longer status messages display time

set -g status-interval 10      # redraw status line every 10 seconds

set -g pane-border-lines heavy # Options: single, double, heavy, simple, number

# activity
set -g monitor-activity on
set -g visual-activity off

# -- navigation ----------------------------------------------------------------

# create session
bind C-c new-session

# find session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# split current window horizontally
unbind '"'
bind - split-window -v

# split current window vertically
unbind %
bind '\' split-window -h

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Maximize
bind -r M resize-pane -Z

# -- copy mode -----------------------------------------------------------------

set-window-option -g mode-keys vi

bind Enter copy-mode # enter copy mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

unbind -T copy-mode-vi MouseDragEnd1Pane

# -- styling -------------------------------------------------------------------

# Colors from one-dark
OD_BLACK="#282c34"
OD_BLUE="#61afef"
OD_YELLOW="#e5c07b"
OD_RED="#e06c75"
OD_WHITE="#aab2bf"
OD_GREEN="#98c379"
OD_GREY="#3e4452"

# Nerdfont characters
HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
TRIANGLE_OPEN="#(printf '\uE0B2')"
TRIANGLE_CLOSE="#(printf '\uE0B0')"
TRIANGLE_LINE_OPEN="#(printf '\uE0B3')"
TRIANGLE_LINE_CLOSE="#(printf '\uE0B1')"
TRIANGLE_INVERSE_OPEN="#(printf '\uE0D6')"
TRIANGLE_INVERSE_CLOSE="#(printf '\uE0D7')"

set -g status-position bottom
# Show the window list centered between the left and the right section
set -g status-justify centre

# -- Max Section Length
set -g status-left-length 100
set -g status-right-length 100

# -- Pane Border
set -g pane-border-style "fg=${OD_GREY}"
set -g pane-active-border-style "fg=${OD_BLUE}"

# -- Session Selection
set -g mode-style "fg=${OD_BLACK},bg=${OD_BLUE}"

# -- Message Bar
set -g message-style "fg=${OD_BLACK},bg=${OD_GREEN}"

# -- Statusbar
set -g status-style bg=default,fg=default

# -- Left Content Section
set -g status-left "\
#[fg=${OD_GREEN},bg=${OD_GREEN}] \
#[fg=${OD_BLACK},bg=${OD_GREEN}]#S \
#[fg=${OD_GREEN},bg=default]${TRIANGLE_CLOSE}\
"

# -- Right Content Section
set -g status-right "\
#[fg=${OD_WHITE},bg=default]${TRIANGLE_OPEN}\
#[fg=${OD_BLACK},bg=${OD_WHITE}] #h\
#[fg=${OD_WHITE},bg=${OD_WHITE}] \
"

# -- Inactive Windows
set -g window-status-format "#[fg=${OD_WHITE},bg=${OD_BLACK}]  #I: #W  "

# -- Active Windows
set -g window-status-current-format "\
#[fg=${OD_BLUE},bg=default]${TRIANGLE_OPEN}\
#[fg=${OD_BLACK},bg=${OD_BLUE}] #I: #W \
#[fg=${OD_BLUE},bg=default]${TRIANGLE_INVERSE_OPEN}"

# Remove the separator between window list items, as we already have spacing
# "around" inactive items
set -g window-status-separator ""

# -- plugins -------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin '27medkamal/tmux-session-wizard'
set -g @plugin 'christoomey/vim-tmux-navigator'

# -- plugins options -----------------------------------------------------------
set -g @resurrect-capture-pane-contents 'on'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
